; NOTE: this file alone does NOT reliably reach Railway's Nixpacks PHP build — confirmed in
; production that uploads over ~2M still failed after this file was committed. The actual fix
; is nixpacks.toml (finds the real php.ini directory inside the Nix store at build time and
; drops an upload.ini next to it, which PHP auto-loads). Kept here too as a harmless local/
; XAMPP override and in case some other environment does pick up a root php.ini.
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
