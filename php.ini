; Nixpacks (Railway) picks up a php.ini in the project root and merges it into the
; container's runtime php.ini. Without this, the default upload_max_filesize/post_max_size
; on a fresh Nixpacks PHP build is small (often 2M), which silently fails product-photo
; uploads through Livewire's file upload endpoint ("The photo failed to upload.") the moment
; a photo is larger than that — well within the range of an ordinary phone photo.
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
